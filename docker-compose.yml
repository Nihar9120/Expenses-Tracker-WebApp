version: "3.8"

services:
 mysql_db:
  image: mysql
  container_name: mysql
  environment:
   MYSQL_ROOT_PASSWORD: Test@123
   MYSQL_DATABASE: expenses_tracker
  restart: always
  healthcheck:
   test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pTest@123"]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 60s
  ports:
   - "3306:3306"
  networks:
   - "expense-app-nw"

 java_app:
  build:
   context: .
  container_name: expenseapp
  environment:
   SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expenses_tracker?allowPublicKeyRetrieval=true&useSSL=false
   SPRING_DATASOURCE_USERNAME: root
   SPRING_DATASOURCE_PASSWORD: Test@123
  ports:
   - "8080:8080"
  networks:
   - "expense-app-nw"
  restart: always
  healthcheck:
   test: ["CMD-SHELL","curl -f http://localhost:8080/admin || exit 1"]
   interval: 10s
   timeout: 5s
   retries: 5
   start_period: 30s
  depends_on:
   mysql_db:
    condition: service_healthy

networks:
 expense-app-nw:
